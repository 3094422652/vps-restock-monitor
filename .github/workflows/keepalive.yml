name: keepalive (防自动停用)
on:
  schedule:
    # GitHub 会暂停 60 天无活动的仓库的定时任务，每月 1 号提交一个空 commit 保活
    - cron: "0 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Keepalive commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          TODAY=$(date -u +%F)
          git commit --allow-empty -m "keepalive $TODAY"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" HEAD:main
