name: watch (长驻值守-已停用自动排班)
# 已采用方案 A（5 分钟轻量瞬态错峰轮询），已全面关闭自动长驻排班以彻底消除封号风险
# 如需临时测试可手动点击 workflow_dispatch 触发
on:
  workflow_dispatch:
concurrency:
  group: vps-restock-watch
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: python monitor.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          CHAIN_PAT: ${{ secrets.CHAIN_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          ALLOW_STATE_COMMIT: "1"
          MAX_MINUTES: "244"
          CHECK_INTERVAL: "25"
          HEARTBEAT_HOURS: "2"
