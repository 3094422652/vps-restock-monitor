name: check (5分钟错峰快查)
on:
  schedule:
    # 方案 A：每 5 分钟错峰单点快查（避开 0/5/10 整倍数高峰，2, 7, 12, 17, 22...）
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
concurrency:
  group: vps-restock-check
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Run quick check
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLARESOLVERR_URL: http://localhost:8191
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          ALLOW_STATE_COMMIT: "1"
        run: |
          if [ "$IS_DISPATCH" = "1" ]; then
            python monitor.py --once --force
          else
            python monitor.py --once
          fi
